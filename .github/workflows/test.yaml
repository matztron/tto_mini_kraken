name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog cmake g++ git

      # Set Python up and install cocotb
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: pip install -r test/requirements.txt

      - name: Install pioasm
        shell: bash
        run: |
          # Build only tools/pioasm from pico-sdk (sparse checkout).
          # PIOASM_VERSION_STRING is required by pico-sdk >= 2.2.
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          git -C /tmp/pico-sdk sparse-checkout set tools/pioasm
          cmake -S /tmp/pico-sdk/tools/pioasm -B /tmp/pioasm-build \
            -DPIOASM_VERSION_STRING=2.2.0
          cmake --build /tmp/pioasm-build -j"$(nproc)"
          sudo cp /tmp/pioasm-build/pioasm /usr/local/bin/pioasm
          pioasm --version

      - name: Run tests
        run: |
          cd test
          make clean
          make assemble
          make
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*
